<style>

  .dev th, .dev td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--linea); vertical-align: top; }
  .dev .dati { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0; }
  .dev .dati div { background: var(--superficie-2); border-radius: 6px; padding: 8px 10px; }
  .dev dt { font-size: 12px; color: var(--tenue); text-transform: uppercase; letter-spacing: 0.06em; }
  .dev dd { margin: 0; font-weight: 600; }
  .nome-dev { background: linear-gradient(100deg, #e0201c 0%, #e0201c 40%, #fff 50%, #e0201c 60%, #e0201c 100%); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: nome-dev 1.6s linear infinite; }
  @keyframes nome-dev { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .nome-dev { animation: none; background-position: 50% 0; } }

<script>
// Il contenuto si decifra nel browser con le credenziali (AES-GCM, chiave PBKDF2): senza quelle giuste non si legge
const dati = JSON.parse(document.getElementById('cifrato').textContent);
const byte = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
document.getElementById('modulo').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errore = document.getElementById('errore');
  errore.textContent = 'Controllo…';
  try {
    const segreto = `${document.getElementById('utente').value.trim().toLowerCase()}:${document.getElementById('password').value}`;
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(segreto), 'PBKDF2', false, ['deriveKey']);
    const chiave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: byte(dati.sale), iterations: dati.iterazioni, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const testo = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: byte(dati.iv) }, chiave, byte(dati.testo));
    const contenuto = document.getElementById('contenuto');
    contenuto.innerHTML = new TextDecoder().decode(testo);
    for (const t of contenuto.querySelectorAll('table')) { const w = document.createElement('div'); w.className = 'tabella'; t.replaceWith(w); w.appendChild(t); }
    contenuto.hidden = false;
    document.getElementById('accesso').hidden = true;
  } catch {
    errore.textContent = 'Nome utente o password sbagliati.';
  }
});
</script>
